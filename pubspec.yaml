name: get_teksi
description: "GET.teksi — name your own fare. Ride or drive, all in one app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Map rendering over OpenStreetMap raster tiles. Deliberately not
  # google_maps_flutter: this keeps the app free of Google Play Services, so
  # the same build runs on Huawei devices with no GMS.
  flutter_map: ^8.3.1
  latlong2: ^0.10.0

  provider: ^6.1.5
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
