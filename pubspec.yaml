name: get_teksi
description: "GET.teksi — name your own fare. Ride or drive, all in one app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Map rendering over OpenStreetMap raster tiles. Deliberately not
  # google_maps_flutter: this keeps the app free of Google Play Services, so
  # the same build runs on Huawei devices with no GMS.
  flutter_map: ^8.3.1
  latlong2: ^0.10.0

  provider: ^6.1.5
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  supabase_flutter: ^2.17.2
  web: ^1.1.1

  # Used by the OSRM route service. supabase_flutter already pulls http in
  # transitively, but a direct dependency is what this code actually has —
  # relying on a transitive one means a Supabase upgrade can break routing.
  http: ^1.5.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb — see l10n.yaml.
  generate: true
